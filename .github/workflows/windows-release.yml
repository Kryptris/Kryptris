name: Windows Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Release-Tag und Paketversion abgleichen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ('${{ github.ref_name }}' -ne $expectedTag) {
            throw "Release-Tag ${{ github.ref_name }} passt nicht zu package.json ($expectedTag)."
          }
      - name: pnpm 11.13.0 installieren
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11.13.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright-Chromium installieren
        run: pnpm exec playwright install chromium
      - run: pnpm verify
      - run: pnpm audit:prod
      - run: pnpm licenses:prod
      - run: pnpm test:e2e
      - run: pnpm make
      - run: pnpm security:check-fuses
      - name: NSIS installieren, installierte App prüfen und E2E-Kopie vorbereiten
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = (Resolve-Path "release/Vaulta-$version-Setup.exe").Path
          $installRoot = Join-Path $env:RUNNER_TEMP 'vaulta-nsis'
          $installDir = Join-Path $installRoot 'Vaulta'
          $appData = Join-Path $env:RUNNER_TEMP 'vaulta-nsis-appdata'
          $e2eCopy = Join-Path $env:RUNNER_TEMP 'vaulta-installed-e2e-copy'
          if ($installDir -match '\s') {
            throw "Der stille NSIS-Installationspfad darf keine Leerzeichen enthalten: $installDir"
          }
          New-Item -ItemType Directory -Path $installRoot, $appData, $e2eCopy -Force | Out-Null
          $sentinel = Join-Path $appData 'Vaulta\preserve.sentinel'
          New-Item -ItemType Directory -Path (Split-Path $sentinel) -Force | Out-Null
          Set-Content -LiteralPath $sentinel -Value 'Nutzerdaten müssen erhalten bleiben.' -Encoding utf8
          "VAULTA_E2E_INSTALL_DIR=$installDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VAULTA_E2E_APPDATA=$appData" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VAULTA_E2E_SENTINEL=$sentinel" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $env:APPDATA = $appData
          $process = Start-Process -FilePath $installer -ArgumentList @('/currentuser', '/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Der NSIS-Installer wurde mit Exitcode $($process.ExitCode) beendet."
          }
          $installedExe = Join-Path $installDir 'Vaulta.exe'
          $uninstaller = Join-Path $installDir 'Uninstall Vaulta.exe'
          if (!(Test-Path -LiteralPath $installedExe -PathType Leaf) -or !(Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw 'Die erwartete installierte Vaulta-EXE oder der Uninstaller fehlt.'
          }
          node scripts/check-fuses.cjs $installedExe
          node scripts/scan-artifacts.mjs $installDir
          Copy-Item -Path (Join-Path $installDir '*') -Destination $e2eCopy -Recurse -Force
          New-Item -ItemType File -Path (Join-Path $e2eCopy '.vaulta-e2e-copy') -Force | Out-Null
          $e2eExecutable = Join-Path $e2eCopy 'Vaulta.exe'
          node scripts/enable-e2e-inspect.cjs $e2eExecutable
          "VAULTA_E2E_EXECUTABLE=$e2eExecutable" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Installiertes x64-Paket offline durchtesten
        shell: pwsh
        env:
          VAULTA_E2E_MODE: packaged
        run: pnpm exec playwright test tests/e2e/electron-vault-flow.spec.ts
      - name: NSIS deinstallieren und Datenerhalt prüfen
        if: always()
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VAULTA_E2E_INSTALL_DIR)) { exit 0 }
          $uninstaller = Join-Path $env:VAULTA_E2E_INSTALL_DIR 'Uninstall Vaulta.exe'
          if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
            $env:APPDATA = $env:VAULTA_E2E_APPDATA
            $process = Start-Process -FilePath $uninstaller -ArgumentList @('/currentuser', '/S') -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Der NSIS-Uninstaller wurde mit Exitcode $($process.ExitCode) beendet."
            }
            for ($attempt = 0; $attempt -lt 120 -and (Test-Path -LiteralPath $env:VAULTA_E2E_INSTALL_DIR); $attempt += 1) {
              Start-Sleep -Milliseconds 250
            }
          }
          if (Test-Path -LiteralPath $env:VAULTA_E2E_INSTALL_DIR) {
            throw 'Der NSIS-Uninstaller hat das Installationsverzeichnis nicht entfernt.'
          }
          if (!(Test-Path -LiteralPath $env:VAULTA_E2E_SENTINEL -PathType Leaf)) {
            throw 'Der NSIS-Uninstaller hat trotz Produktentscheidung lokale Nutzerdaten entfernt.'
          }
      - run: pnpm security:scan-artifacts
      - name: SHA-256-Prüfsummen erzeugen
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expected = @(
            "Vaulta-$version-Setup.exe",
            "Vaulta-$version-x64.zip",
            "Vaulta-$version-arm64.zip"
          )
          $actual = @(Get-ChildItem -Path release -File | Where-Object { $_.Extension -in '.exe', '.zip' } | Select-Object -ExpandProperty Name | Sort-Object)
          $difference = @(Compare-Object -ReferenceObject ($expected | Sort-Object) -DifferenceObject $actual)
          if ($difference.Count -ne 0) {
            throw "Release-Artefakte weichen von der exakten Sollmenge ab: $($actual -join ', ')"
          }
          $checksums = $expected | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path release $_)).Hash.ToLowerInvariant()
            "$hash  $_"
          }
          $checksums | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vaulta-windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vaulta-windows-${{ github.ref_name }}
          path: release
      - name: Heruntergeladene Release-Artefakte verifizieren
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd release
          expected=("Vaulta-$version-Setup.exe" "Vaulta-$version-x64.zip" "Vaulta-$version-arm64.zip" "SHA256SUMS.txt")
          for artifact in "${expected[@]}"; do
            test -f "$artifact" || { echo "Fehlendes Release-Artefakt: $artifact" >&2; exit 1; }
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          sha256sum --check SHA256SUMS.txt
      - name: GitHub Release veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "release/Vaulta-$version-Setup.exe" \
            "release/Vaulta-$version-x64.zip" \
            "release/Vaulta-$version-arm64.zip" \
            release/SHA256SUMS.txt \
            --verify-tag --generate-notes
